name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('custom_components/harf_vevor_weather/manifest.json').read_text())
          assert os.environ['GITHUB_REF_NAME'] == f"v{manifest['version']}"
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
